[changelog]
header = "# Riff Companion changelog\n\n<!-- Generated by git-cliff. Do not edit manually. -->\n\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="companion-v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking_description %}: {{ commit.breaking_description | trim }}{% endif %}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^companion-v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
include_paths = [
  "Companion/**", "Shared/Sounds/**", "Riff/Resources/sound-packs.json",
  "scripts/build-windows.ps1", "scripts/prepare-companion-release.sh",
  "scripts/test-companion-release.py",
  ".github/workflows/companion.yml", ".github/companion-cliff.toml",
  "docs/WINDOWS-QUICKSTART.txt", "docs/THIRD-PARTY.md", "docs/licenses/**",
  "global.json", "NuGet.Config", "nuget.config",
  "Directory.Build.props", "Directory.Build.targets", "Directory.Packages.props",
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Changed" },
]

[bump]
initial_tag = "companion-v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true
